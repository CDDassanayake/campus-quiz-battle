# Campus Quiz Battle - client configuration
# Leave client.server.host empty to find servers with UDP discovery.
client.server.host=
client.gateway.port=5050
client.tls.port=5443
udp.discovery.port=5051
udp.feed.port=5052
udp.feed.mode=broadcast
udp.multicast.group=230.0.0.1

# Public certificate of the server (safe to share, never share keystore.p12)
security.truststore.path=secrets/truststore.p12
# Password via environment variable QB_KEYSTORE_PASSWORD
