# Campus Quiz Battle - server configuration
# Secrets (passwords, token key) are NEVER stored here. Use environment variables:
#   QB_KEYSTORE_PASSWORD   password of secrets/keystore.p12
#   QB_TOKEN_SECRET        random string (32+ chars) used to sign session tokens

server.name=Quiz Battle Server

# M1 - NIO gateway (game traffic, plain TCP, token required)
gateway.port=5050

# M5 - TLS authentication server (login/register)
tls.auth.port=5443
security.keystore.path=secrets/keystore.p12
security.token.ttl.minutes=60

# M3 - UDP
udp.discovery.port=5051
udp.feed.port=5052
# broadcast | multicast  (use multicast if the Wi-Fi blocks broadcast)
udp.feed.mode=broadcast
udp.multicast.group=230.0.0.1

# M4 - game core
game.handler.pool.size=8
game.question.time.seconds=15
game.questions.file=questions/sample-questions.csv
# Optional: download questions from a URL first (leave empty to disable)
game.questions.url=
